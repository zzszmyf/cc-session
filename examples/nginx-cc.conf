# Example nginx location for cc-session / ttyd.
#
# Put this inside your HTTPS server block. Replace the upstream address with
# the host/port where `cc-session web` or `cc-session hub` is listening.
#
# Never expose ttyd without authentication. This example uses HTTP Basic Auth;
# use TLS, a VPN, or an SSO proxy for anything beyond a private network.

location /cc/ {
    auth_basic "cc-session";
    auth_basic_user_file /etc/nginx/.htpasswd;

    proxy_pass http://127.0.0.1:7681;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ttyd uses WebSocket for the terminal stream.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}
